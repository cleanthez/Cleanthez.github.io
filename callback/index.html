<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TinkerScan · Tesla sign-in</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#000;color:#fff;padding:2rem;max-width:40rem;margin:0 auto}
code{word-break:break-all;background:#171a20;padding:.75rem;display:block;border-radius:8px;margin:1rem 0}
a.btn{display:inline-block;background:#fff;color:#000;padding:.9rem 1.2rem;border-radius:8px;text-decoration:none;font-weight:600;margin:.5rem 0}
.sub{color:#9a9ca0;font-size:.95rem}
</style></head><body>
<h1>Signed in</h1>
<p class="sub" id="msg">Opening TinkerScan…</p>
<p><a class="btn" id="open" href="#">Open TinkerScan</a></p>
<p class="sub">If the app doesn’t open, copy the code below and paste it into TinkerScan → Connection → Tesla account.</p>
<code id="out">Looking for code…</code>
<script>
const p=new URLSearchParams(location.search);
const code=p.get('code');
const state=p.get('state')||'';
const err=p.get('error');
const el=document.getElementById('out');
const msg=document.getElementById('msg');
const open=document.getElementById('open');
if(err){
  msg.textContent='Sign-in failed: '+err+' '+(p.get('error_description')||'');
  el.textContent=err;
  open.style.display='none';
} else if(code){
  el.textContent=code;
  const deep='tinkerscan://oauth/callback?code='+encodeURIComponent(code)+'&state='+encodeURIComponent(state);
  open.href=deep;
  msg.textContent='Tap Open TinkerScan to finish signing in.';
  // Auto-try once; Custom Tabs / browsers may block it — button remains.
  setTimeout(function(){ location.href=deep; }, 400);
} else {
  el.textContent='No code in URL. Full query: '+location.search;
  open.style.display='none';
}
</script>
</body></html>
