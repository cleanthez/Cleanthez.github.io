<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Tesla OAuth callback</title>
<style>body{font-family:system-ui;background:#111;color:#eee;padding:2rem}code{word-break:break-all;background:#222;padding:.5rem;display:block}</style>
</head><body>
<h1>Tesla auth callback</h1>
<p>Copy the code below and paste it back to Tesla Tinker in chat.</p>
<code id="out">Looking for code…</code>
<script>
const p=new URLSearchParams(location.search);
const code=p.get('code');
const err=p.get('error');
const el=document.getElementById('out');
if(err){el.textContent='Error: '+err+' '+(p.get('error_description')||'');}
else if(code){el.textContent=code;}
else{el.textContent='No code in URL. Full query: '+location.search;}
</script>
</body></html>
